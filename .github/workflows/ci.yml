name: RTL verification and synthesis
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned FPGA tools
        run: |
          python scripts/install_tools.py --destination "$RUNNER_TEMP/fpga-tools"
          echo "OSS_CAD_SUITE=$RUNNER_TEMP/fpga-tools/oss-cad-suite" >> "$GITHUB_ENV"
      - name: Static checks
        run: python scripts/lint.py
      - name: Reference tests and RTL scoreboard
        run: python scripts/run.py test --frames 500 --seeds 7 123
      - name: Mapped synthesis and internal timing experiment
        run: python scripts/synthesize.py --frequency 50
      - name: Summarize matching reports
        run: python scripts/report.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            results/
            build/synth/*.log
          retention-days: 14
